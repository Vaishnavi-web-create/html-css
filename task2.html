<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tables Task</title>
    <style>
        #a{
            border:4px ridge violet;
            background-color:lightcoral;
        }
        h3{
            color:blue;
            text-align:center;
            text-decoration:underline;
            text-shadow:2px 2px 2px aquamarine;
            
        }
        #bank{
            margin-top:10px;
        }
        table{
            width:100%;
            background-color:lightblue;
        }
        table,th,td{
            border:2px solid royalblue;
            border-collapse:collapse;
        }
        td{
            text-align:center;
            color:darkgreen;
            text-shadow:2px 2px lime;
            padding:4px;
        }
        th{
            text-align:center;
            color:purple;
            text-shadow:2px 2px 2px palevioletred;
            padding:5px;
        }
        #b{
           display:block;
           background-color:lightskyblue;
           padding:10px;
           margin-top:10px;
           height:50px;
        }
        p{
            color:magenta;
        }
        span{
            color:green;
            background-color:pink;
            text-transform:capitalize;
            text-shadow:2px 2px greenyellow;
        }
    </style>
</head>
<body>
    <div id="a">
    <h3>BANK DETAILS</h3>
    </div>
    <div id="bank">
    <table>
        <tr>
            <th>Username</th>
            <th>Bank name</th>
            <th>Balance Amount </th>
            <th>Withdrawal Amount</th>
            <th>Deposited Amount</th>
        </tr>
        <tr>
            <td>Meera</td>
            <td>SBI</td>
            <td>20000</td>
            <td>20000</td>
            <td>40000</td>
        </tr>
        <tr>
            <td>Nithya</td>
            <td>CUB</td>
            <td>30000</td>
            <td>10000</td>
            <td>40000</td>
        </tr>
        <tr>
            <td>Sathya</td>
            <td>IOB</td>
            <td>50000</td>
            <td>50000</td>
            <td>100000</td>
        </tr>
        <tr>
            <td>Rahul</td>
            <td>Indian Bank</td>
            <td>70000</td>
            <td>30000</td>
            <td>100000</td>
        </tr>
        <tr>
            <td>Arun</td>
            <td>CUB</td>
            <td>45000</td>
            <td>5000</td>
            <td>50000</td>
        </tr>
    </table>
    </div>
    <div id="b">
    <p>These are the <span>bank details</span> of the customers.</p>
    </div>
</body>
</html>
